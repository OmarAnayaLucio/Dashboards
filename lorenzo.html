<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorenzo ✨ | Lista de Regalos</title>

    <!-- ============================================ -->
    <!-- METAETIQUETAS PARA WHATSAPP Y REDES SOCIALES  -->
    <!-- ============================================ -->
    <meta property="og:title" content="Invitación Lorenzo ✨" />
    <meta property="og:description" content="Te esperamos el Jueves 16 de julio de 2026. ¡Mira los detalles y nuestra mesa de regalos!" />
    <meta property="og:image" content="https://omaranayalucio.github.io/Dashboards/lorenzo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://omaranayalucio.github.io/Dashboards/lorenzo.html" />
    <!-- ============================================ -->

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== FONDO: OCUPA TODA LA PANTALLA SIN SCROLL ===== */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        /* ===== CONTENEDOR DEL GIF DE FONDO ===== */
        .background-full {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            object-fit: cover;
            pointer-events: none;
        }

        /* ===== CAPA OSCURA PARA MEJOR LECTURA ===== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        /* ===== CONTENEDOR FLEX QUE OCUPA EL 100% DE LA PANTALLA ===== */
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            padding: 2vh 2vw;
        }

        /* ===== FECHA ESTÉTICA ===== */
        .fecha-wrapper {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 1.2vh 2.5vw;
            border-radius: 60px;
            margin-bottom: 2vh;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 215, 0, 0.5);
            animation: pulse-glow 2.5s ease-in-out infinite;
            text-align: center;
            flex-shrink: 0;
        }

        .fecha-wrapper .frase {
            font-size: clamp(0.6rem, 1.2vh, 0.9rem);
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #8b6b4d;
            font-weight: 600;
            font-family: 'Arial', sans-serif;
        }

        .fecha-wrapper .fecha {
            font-size: clamp(1.2rem, 3vh, 2.5rem);
            font-weight: 700;
            color: #2c1810;
            letter-spacing: 2px;
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #b8860b, #d4a017);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .fecha-wrapper .fecha span {
            font-weight: 300;
            color: #6b4c3b;
            -webkit-text-fill-color: #6b4c3b;
        }

        /* ===== IMAGEN (INVITACIÓN) - OCUPA EL ESPACIO DISPONIBLE ===== */
        .image-link {
            display: block;
            max-width: 85vh;
            max-height: 70vh;
            width: auto;
            height: auto;
            cursor: pointer;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 3px solid rgba(255, 215, 0, 0.2);
            flex-shrink: 1;
        }

        .image-link:hover {
            transform: scale(1.02);
            box-shadow: 0 25px 70px rgba(255, 215, 0, 0.25);
        }

        .image-link img {
            width: 100%;
            height: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }

        /* ===== TEXTO AYUDANTE ===== */
        .texto-ayuda {
            margin-top: 1.5vh;
            color: rgba(255, 255, 255, 0.9);
            font-size: clamp(0.6rem, 1.2vh, 0.9rem);
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            padding: 0.8vh 2vw;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-family: 'Arial', sans-serif;
            flex-shrink: 0;
        }

        .texto-ayuda i {
            font-style: normal;
            display: inline-block;
            animation: bounce-arrow 1.8s ease-in-out infinite;
        }

        /* ===== ANIMACIONES ===== */
        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 8px 32px rgba(255, 215, 0, 0.2);
                border-color: rgba(255, 215, 0, 0.4);
            }
            50% {
                box-shadow: 0 8px 48px rgba(255, 215, 0, 0.5);
                border-color: rgba(255, 215, 0, 0.9);
            }
        }

        @keyframes bounce-arrow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .fecha-wrapper {
                padding: 1vh 3vw;
                margin-bottom: 1.5vh;
            }
            .fecha-wrapper .fecha {
                font-size: clamp(1rem, 2.5vh, 1.8rem);
            }
            .fecha-wrapper .frase {
                font-size: clamp(0.5rem, 1vh, 0.7rem);
                letter-spacing: 1px;
            }
            .image-link {
                max-width: 90vw;
                max-height: 60vh;
            }
            .image-link img {
                max-height: 60vh;
            }
            .texto-ayuda {
                font-size: clamp(0.5rem, 1vh, 0.7rem);
                padding: 0.6vh 3vw;
                margin-top: 1vh;
            }
        }

        @media (max-aspect-ratio: 1/1) {
            .image-link {
                max-width: 80vw;
                max-height: 55vh;
            }
            .image-link img {
                max-height: 55vh;
            }
        }
    </style>
</head>
<body>

    <!-- ===== GIF DE BUZZ LIGHTYEAR OCUPANDO TODA LA PANTALLA ===== -->
    <img
        class="background-full"
        src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExMXlqbG01c2Q1M3E5eW94ZHJ4c2d3YzRpcW9naTk2dXoxbXZoYXUzeCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/d81n9rX8stxbRbqrbG/giphy.gif"
        alt="Fondo Buzz Lightyear Toy Story"
        loading="lazy"
    >

    <!-- ===== CAPA OSCURA ===== -->
    <div class="overlay"></div>

    <!-- ===== CONTENIDO CENTRADO ===== -->
    <div class="content">
        <!-- FECHA -->
        <div class="fecha-wrapper">
            <div class="frase">✨ Los esperamos el</div>
            <div class="fecha">
                Jueves 16 <span>de</span> julio <span>de</span> 2026
            </div>
        </div>

        <!-- IMAGEN ENLAZADA A AMAZON -->
        <a
            href="https://www.amazon.com.mx/registries/gl/guest-view/1SGPNLAL4T6J3"
            target="_blank"
            class="image-link"
        >
            <img
                src="https://omaranayalucio.github.io/Dashboards/lorenzo.png"
                alt="Invitación Lorenzo - Haz clic para ver la lista de regalos"
                loading="lazy"
            >
        </a>

        <!-- TEXTO AYUDANTE -->
        <p class="texto-ayuda">
            <i>👇</i> Haz clic en la imagen para ver la lista de regalos en Amazon <i>👇</i>
        </p>
    </div>

</body>
</html>
