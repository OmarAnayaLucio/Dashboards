<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Ejecutivo · Portafolio RENOVA</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
    --teal:       #52BEC0;
    --teal-light: rgba(82,190,192,0.12);
    --teal-mid:   rgba(82,190,192,0.3);
    --cyan:       #00E5E5;
    --black:      #0A0A0A;
    --dark:       #3B3B3B;
    --gray1:      #EBEBEE;
    --gray2:      #DFDFE1;
    --gray3:      #C8C8CB;
    --white:      #ffffff;
    --bg:         #F0F2F5;
    --green:      #2E9E6B;
    --mint:       #3EB489;
    --mint-bg:    #E0F5EC;
    --amber:      #C07D20;
    --amber-bg:   #FEF3E2;
    --red:        #C0392B;
    --red-bg:     #FDECEA;

    /* TYPOGRAPHY SCALE — 3 levels only */
    --fs-base:    12px;
    --fs-sm:      11px;
    --fs-xs:      10px;
    --fs-h1:      36px;
    --fs-h2:      28px;
    --fs-h3:      22px;
    --fs-h4:      17px;

    --radius-sm:  8px;
    --radius-md:  12px;
    --radius-lg:  18px;
    --radius-xl:  24px;
    --transition: 0.2s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Barlow', sans-serif;
    font-size: var(--fs-base);
    background: var(--bg);
    min-height: 100vh;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
}

/* ============================================================
   SHELL
   ============================================================ */
.dash {
    background: var(--white);
    border-radius: var(--radius-xl);
    max-width: 1600px;
    margin: 0 auto;
    box-shadow: 0 8px 48px rgba(0,0,0,0.12);
    overflow: visible;
}

/* ============================================================
   TOPBAR
   ============================================================ */
.topbar {
    background: var(--black);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 1px solid rgba(82,190,192,0.15);
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.topbar-logo-img { height: 52px; width: auto; }
.topbar-logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 30px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}
.topbar-logo span { color: var(--teal); }
.topbar-sub {
    font-size: var(--fs-xs);
    color: rgba(255,255,255,0.35);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-top: 2px;
}
.topbar-right { display: flex; align-items: center; gap: 20px; }
.topbar-date {
    font-size: var(--fs-xs);
    color: rgba(255,255,255,0.35);
    text-align: right;
    line-height: 1.6;
}
.topbar-date strong {
    display: block;
    color: #fff;
    font-size: var(--fs-base);
    font-weight: 500;
}
.topbar-logo-right {
    height: 72px;
    width: auto;
    transition: transform var(--transition);
}
.topbar-logo-right:hover { transform: scale(1.03); }

/* ============================================================
   TAB NAV
   ============================================================ */
.tab-nav {
    background: var(--white);
    padding: 16px 32px 0;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--teal) var(--gray2);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1.5px solid var(--gray2);
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
}
.tab-nav::-webkit-scrollbar { height: 3px; }
.tab-nav::-webkit-scrollbar-track { background: var(--gray2); }
.tab-nav::-webkit-scrollbar-thumb { background: var(--teal); border-radius: 4px; }

.tab-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: var(--fs-base);
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #888;
    background: transparent;
    border: none;
    border-bottom: 2.5px solid transparent;
    padding: 10px 18px 12px;
    cursor: pointer;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    transition: color var(--transition), border-color var(--transition), background var(--transition);
    white-space: nowrap;
    margin-bottom: -1.5px;
}
.tab-btn:hover { color: var(--teal); background: var(--teal-light); }
.tab-btn.active { color: var(--teal); border-bottom-color: var(--teal); background: transparent; }

/* ============================================================
   PANELS
   ============================================================ */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ============================================================
   SECTION HEADER
   ============================================================ */
.section-header {
    padding: 28px 32px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
}
.section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: var(--fs-xs);
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #999;
    white-space: nowrap;
}
.section-line { flex: 1; height: 1px; background: var(--gray2); }

/* ============================================================
   KPI ROW
   ============================================================ */
.kpi-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    padding: 0 32px 28px;
}
.kpi-card {
    background: var(--gray1);
    border-radius: var(--radius-md);
    padding: 18px 20px 16px;
    position: relative;
    overflow: hidden;
    border: 1px solid transparent;
    transition: border-color var(--transition), box-shadow var(--transition);
}
.kpi-card:hover { border-color: var(--gray3); box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
.kpi-card.accent { background: var(--black); }
.kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--teal);
    border-radius: 0 0 2px 2px;
}
.kpi-card.accent::before { background: var(--cyan); }
/* Color-coded top bars per card position */
.kpi-card:nth-child(2)::before { background: var(--mint); }
.kpi-card:nth-child(3)::before { background: var(--green); }
.kpi-card:nth-child(4)::before { background: var(--amber); }

.kpi-label {
    font-size: var(--fs-xs);
    color: #999;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 600;
}
.kpi-card.accent .kpi-label { color: rgba(255,255,255,0.4); }
.kpi-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: var(--fs-h1);
    font-weight: 700;
    color: var(--black);
    line-height: 1;
    letter-spacing: -0.5px;
}
.kpi-card.accent .kpi-value { color: #fff; }
.kpi-unit {
    font-family: 'Barlow', sans-serif;
    font-size: var(--fs-base);
    font-weight: 400;
    color: #aaa;
    margin-left: 3px;
}
.kpi-note {
    font-size: var(--fs-xs);
    color: #bbb;
    margin-top: 6px;
}

/* ============================================================
   PROJECT CARDS GRID
   ============================================================ */
.projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    padding: 0 32px 32px;
}
.project-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    cursor: pointer;
    border: 1px solid var(--gray2);
    display: flex;
    flex-direction: column;
    will-change: transform;
}
.project-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 32px rgba(0,0,0,0.1);
    border-color: var(--teal);
}

/* Card image */
.card-img {
    position: relative;
    height: 165px;
    background-color: #1c1c1c;
    background-size: cover;
    background-position: center;
    overflow: hidden;
}
.card-img::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 35%, rgba(10,10,10,0.90) 88%);
}
.card-img .overlay { display: none; }
.card-img .proj-number {
    position: absolute;
    bottom: 68px; left: 12px;
    font-size: var(--fs-xs);
    color: var(--teal);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
    z-index: 2;
}
.card-img .proj-name {
    position: absolute;
    bottom: 40px; left: 12px; right: 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: #fff;
    line-height: 1.1;
    z-index: 2;
}
.card-img .proj-addr {
    position: absolute;
    bottom: 12px; left: 12px; right: 12px;
    font-size: var(--fs-xs);
    color: rgba(255,255,255,0.7);
    z-index: 2;
}

/* Stats grid inside card */
.stats-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 14px;
    padding: 12px 14px;
    background: #fafafc;
    border-bottom: 1px solid var(--gray2);
}
.stat-label { color: #999; font-weight: 500; font-size: var(--fs-sm); }
.stat-value { font-weight: 600; color: var(--dark); text-align: right; font-size: var(--fs-sm); }
.stat-value.mint { color: var(--mint); font-weight: 700; }

.financial-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 14px;
    border-bottom: 1px solid var(--gray1);
}
.fin-label { color: #888; font-size: var(--fs-sm); }
.fin-amount { font-weight: 700; color: var(--black); font-size: var(--fs-sm); }
.fin-amount.green { color: var(--green); }

.roi-section {
    padding: 10px 14px 12px;
    background: #fff;
    border-bottom: 1px solid var(--gray1);
}
.roi-title {
    font-size: var(--fs-xs);
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #bbb;
    text-transform: uppercase;
    margin-bottom: 7px;
}
.roi-numbers { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.roi-big {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: var(--fs-h3);
    font-weight: 700;
    color: var(--green);
    line-height: 1;
}
.roi-percent { font-size: var(--fs-sm); font-weight: 700; color: var(--teal); }

.detail-button {
    margin: 10px 14px 14px;
    background: transparent;
    border: 1.5px solid var(--teal);
    border-radius: 40px;
    padding: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: var(--fs-xs);
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--teal);
    cursor: pointer;
    transition: background var(--transition), color var(--transition);
    text-align: center;
    display: block;
}
.detail-button:hover { background: var(--teal); color: white; }

/* ============================================================
   CHARTS ROW
   ============================================================ */
.charts-row {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 16px;
    padding: 0 32px 32px;
}
.chart-wrap {
    background: var(--gray1);
    border-radius: var(--radius-md);
    padding: 22px 24px;
    border: 1px solid var(--gray2);
}
.chart-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
    flex-wrap: wrap;
}
.chart-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: var(--fs-sm);
    font-weight: 700;
    color: var(--dark);
    text-transform: uppercase;
    letter-spacing: 0.8px;
}
.chart-legend { display: flex; align-items: center; gap: 14px; margin-left: auto; }
.chart-legend-item { display: flex; align-items: center; gap: 5px; font-size: var(--fs-xs); color: #777; }
.chart-legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.chart-inner { position: relative; width: 100%; height: 230px; }

/* ============================================================
   DETAIL WRAP
   ============================================================ */
.detail-wrap { padding: 0 32px 40px; }

.hero-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 28px;
}
.left-col { display: flex; flex-direction: column; gap: 16px; }

/* Image card / carousel */
.image-card {
    position: relative;
    background-color: #0a0a0a;
    border-radius: var(--radius-xl);
    overflow: hidden;
    box-shadow: 0 12px 28px rgba(0,0,0,0.15);
    aspect-ratio: 4/3;
    min-height: 260px;
}
.carousel-container { position: relative; width: 100%; height: 100%; }
.carousel-slide { width: 100%; height: 100%; object-fit: cover; display: block; }
.carousel-btn {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.55);
    color: white;
    border: none;
    font-size: 20px;
    cursor: pointer;
    padding: 8px 13px;
    border-radius: 50%;
    transition: background var(--transition);
    z-index: 20;
}
.carousel-btn:hover { background: rgba(0,0,0,0.9); }
.carousel-prev { left: 12px; }
.carousel-next { right: 12px; }
.carousel-dots { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; z-index: 20; }
.dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.45);
    margin: 0 3px;
    cursor: pointer;
    transition: background var(--transition);
}
.dot.active { background: white; }

.image-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.48) 32%, transparent 62%);
    z-index: 15;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px;
    pointer-events: none;
}
.image-overlay .proj-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 34px;
    font-weight: 700;
    color: white;
    margin-bottom: 4px;
}
.image-overlay .proj-address {
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    margin-bottom: 16px;
    border-left: 3px solid var(--teal);
    padding-left: 10px;
}
.tech-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 5px 14px; }
.tech-item { display: flex; justify-content: space-between; align-items: baseline; }
.tech-label { color: rgba(255,255,255,0.65); font-weight: 900; font-size: 13px; }
.tech-value { color: var(--teal); font-weight: 900; text-align: right; font-size: 13px; }

/* Docs / description card */
.docs-description-card {
    background: rgba(10,10,10,0.88);
    backdrop-filter: blur(6px);
    border-radius: var(--radius-xl);
    padding: 18px 22px;
    border: 1px solid rgba(255,255,255,0.08);
}
.section-title-card {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: var(--fs-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--teal);
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding-bottom: 8px;
}
.project-description-text {
    font-size: var(--fs-base);
    line-height: 1.65;
    color: #f0f0f0;
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 18px;
    background: rgba(0,0,0,0.35);
    padding: 14px;
    border-radius: var(--radius-md);
    border-left: 3px solid var(--teal);
    font-weight: 400;
}
.docs-links-flex { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.doc-link-dark {
    background: rgba(255,255,255,0.07);
    border-radius: 30px;
    padding: 6px 14px;
    font-size: var(--fs-xs);
    font-weight: 600;
    color: var(--teal);
    text-decoration: none;
    border: 1px solid rgba(82,190,192,0.25);
    transition: background var(--transition), color var(--transition), border-color var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.doc-link-dark:hover { background: var(--teal); color: white; border-color: var(--teal); }

/* Map card */
.map-card {
    background: var(--black);
    border-radius: var(--radius-xl);
    overflow: hidden;
    box-shadow: 0 12px 28px rgba(0,0,0,0.22);
    display: flex;
    flex-direction: column;
}
.map-header {
    background: rgba(82,190,192,0.08);
    padding: 10px 16px;
    color: var(--teal);
    font-size: var(--fs-sm);
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
}
.map-header::before { content: "📍"; font-size: 13px; }
.map-frame { width: 100%; height: 240px; border: none; display: block; background: #1a1a1a; }
.map-placeholder {
    width: 100%; height: 240px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    background: #1a1a1a;
    color: #777;
    font-size: var(--fs-base);
}
.map-link {
    color: var(--teal);
    text-decoration: none;
    font-size: var(--fs-sm);
    font-weight: 600;
    border: 1px solid var(--teal);
    padding: 6px 16px;
    border-radius: 20px;
    transition: background var(--transition), color var(--transition);
}
.map-link:hover { background: var(--teal); color: white; }

.surroundings-section { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.07); }
.surroundings-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: var(--fs-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--teal);
    margin-bottom: 10px;
}
.surroundings-title::before { content: "🏙️"; font-size: 11px; }
.surroundings-list { display: flex; flex-wrap: wrap; gap: 6px; }
.surrounding-badge {
    background: rgba(255,255,255,0.1);
    border-radius: 40px;
    padding: 4px 10px;
    font-size: var(--fs-xs);
    font-weight: 500;
    color: #ddd;
    transition: background var(--transition), color var(--transition);
    cursor: default;
}
.surrounding-badge:hover { background: var(--teal); color: white; }
.empty-surroundings { font-size: var(--fs-sm); color: #666; font-style: italic; }

/* ============================================================
   UNITS PIVOT TABLE
   ============================================================ */
.units-pivot-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--gray2);
    box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    margin-bottom: 20px;
}
.units-pivot-header {
    background: var(--black);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
}
.units-pivot-header-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: var(--fs-sm);
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--teal);
}
.units-pivot-header-right { display: flex; gap: 14px; align-items: center; }
.units-pivot-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(82,190,192,0.12);
    border: 1px solid rgba(82,190,192,0.3);
    border-radius: 30px;
    padding: 4px 12px;
    font-size: var(--fs-sm);
    font-weight: 600;
    color: var(--teal);
}
.units-pivot-pill .pill-count {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: var(--fs-h4);
    font-weight: 700;
    color: #fff;
    line-height: 1;
}
.units-pivot-cost-total { text-align: right; }
.units-pivot-cost-total-label {
    font-size: var(--fs-xs);
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 2px;
}
.units-pivot-cost-total-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: var(--fs-h3);
    font-weight: 700;
    color: var(--teal);
}

.units-pivot-table { width: 100%; border-collapse: collapse; }
.units-pivot-table th {
    font-size: var(--fs-xs);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #999;
    padding: 10px 24px 8px;
    text-align: left;
    border-bottom: 1px solid var(--gray2);
    background: #fafafc;
}
.units-pivot-table th:last-child,
.units-pivot-table td:last-child { text-align: right; padding-right: 24px; }
.units-pivot-table td {
    padding: 10px 24px;
    border-bottom: 1px solid var(--gray1);
    color: var(--dark);
    vertical-align: middle;
    font-size: var(--fs-sm);
}
.units-pivot-table td:first-child { font-weight: 600; }
.units-pivot-table tr.subtotal-row { background: #f4f6f9; font-weight: 700; }
.units-pivot-table tr.subtotal-row td { border-top: 2px solid var(--gray2); border-bottom: 2px solid var(--gray2); color: var(--black); }

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQHHgMYg7UBumLaA1o-1Y7L7-hrWrjnI-eyLvrZarX44TysmxIPs9c-O4l7E_V6AIwF4wA__D_2hiH6/pub?output=csv";

/* ── CSV PARSER ─────────────────────────────────────────── */
function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQ = false;
    for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '"') { if (inQ && text[i+1] === '"') { field += '"'; i++; } else inQ = !inQ; }
        else if (ch === ',' && !inQ) { row.push(field.trim()); field = ""; }
        else if ((ch === '\n' || (ch === '\r' && text[i+1] === '\n')) && !inQ) {
            if (ch === '\r') i++;
            row.push(field.trim());
            if (row.length) rows.push(row);
            row = []; field = "";
        } else { field += ch; }
    }
    if (field || row.length) { row.push(field.trim()); if (row.length) rows.push(row); }
    return rows;
}

function toNumber(val) {
    if (!val || val === "" || val === "#DIV/0!") return 0;
    const n = parseFloat(String(val).replace(/[^0-9.-]/g, ''));
    return isNaN(n) ? 0 : n;
}

function parseDate(str) {
    if (!str) return null;
    str = str.trim();
    let m;
    const MESES = { ene:0,jan:0,feb:1,mar:2,abr:3,apr:3,may:4,jun:5,jul:6,ago:7,aug:7,sep:8,oct:9,nov:10,dic:11,dec:11,enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,octubre:9,noviembre:10,diciembre:11 };
    m = str.match(/^([a-zA-Z]{3})\/(\d{2})$/);
    if (m) { const mes = MESES[m[1].toLowerCase()]; if (mes !== undefined) { let y = parseInt(m[2],10); if (y<100) y+=2000; return new Date(y,mes,1); } }
    m = str.match(/^([a-zA-Z]{3})\/(\d{4})$/);
    if (m) { const mes = MESES[m[1].toLowerCase()]; if (mes !== undefined) return new Date(parseInt(m[2],10),mes,1); }
    m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return new Date(+m[3],+m[2]-1,+m[1]);
    m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return new Date(+m[1],+m[2]-1,+m[3]);
    m = str.match(/^([a-záéíóúñ]+)\s+(\d{4})$/i);
    if (m) { const mes = MESES[m[1].toLowerCase()]; if (mes !== undefined) return new Date(+m[2],mes,1); }
    const d = new Date(str);
    return isNaN(d) ? null : d;
}

function extractImageUrls(cell) {
    if (!cell) return [];
    return cell.split(/\r?\n/).map(s => s.trim()).filter(s => s.startsWith('http'));
}

function findHeaderRow(rows) {
    const kw = ["proyecto","mapa","precio de venta","ganancia neta","construcción m2","terreno m2"];
    for (let i = 0; i < Math.min(rows.length, 10); i++) {
        const txt = (rows[i]||[]).join(" ").toLowerCase();
        let hits = 0; for (const k of kw) if (txt.includes(k)) hits++;
        if (hits >= 2) return i;
    }
    return 1;
}

function buildMapEmbedUrl(raw, fallbackAddr) {
    const fromAddr = (a) => { const clean = (a||"").replace(/[\n\r]/g,' ').trim(); if (!clean) return null; return `https://maps.google.com/maps?q=${encodeURIComponent(clean)}&t=&z=16&ie=UTF8&iwloc=B&output=embed`; };
    const fromCoords = (lat,lng) => `https://maps.google.com/maps?q=${lat},${lng}&t=&z=16&ie=UTF8&iwloc=B&output=embed`;
    const link = (raw||"").trim();
    if (!link || link.includes("goo.gl") || link.includes("maps.app")) return fromAddr(fallbackAddr);
    if (link.includes("output=embed")) return link.replace("www.google.com/maps","maps.google.com/maps");
    if (link.includes("google.com/maps") || link.includes("maps.google.com")) {
        const coord = link.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
        if (coord) return fromCoords(coord[1],coord[2]);
        const q = link.match(/[?&]q=([^&]+)/);
        if (q) return `https://maps.google.com/maps?q=${q[1]}&t=&z=16&ie=UTF8&iwloc=B&output=embed`;
        const pl = link.match(/\/place\/([^\/]+)\//);
        if (pl) return `https://maps.google.com/maps?q=${pl[1]}&t=&z=16&ie=UTF8&iwloc=B&output=embed`;
    }
    return fromAddr(fallbackAddr);
}

/* ── BUILD PROJECTS ─────────────────────────────────────── */
function buildProjectsFromRows(rows) {
    if (rows.length < 2) return [];
    const headerIdx = findHeaderRow(rows);
    const headers = rows[headerIdx].map(h => h.trim());
    const norm = h => h.toLowerCase().replace(/\s+/g,' ').replace(/[^a-z0-9#ñáéíóú ]/g,'').trim();
    const normH = headers.map(norm);
    const getIdx = (names) => {
        for (const n of names) { const nn = norm(n); let i = normH.findIndex(h => h === nn); if (i !== -1) return i; }
        for (const n of names) { const nn = norm(n); let i = normH.findIndex(h => h.includes(nn)); if (i !== -1) return i; }
        return -1;
    };
    const getV = (row, names) => row[getIdx(names)] || "";
    const getN = (row, names) => toNumber(getV(row, names));

    function getDeptoBlock(row, label) {
        const i = getIdx([label]);
        if (i === -1) return null;
        const costo = toNumber(row[i]), qty = toNumber(row[i+1]);
        if (costo === 0 && qty === 0) return null;
        return { costo, cantidad:qty, m2:toNumber(row[i+2]), costoM2:toNumber(row[i+3]), hab:toNumber(row[i+4]), ban:toNumber(row[i+5]), estac:toNumber(row[i+6]) };
    }
    function getLocalBlock(row, label) {
        const i = getIdx([label]);
        if (i === -1) return null;
        const costo = toNumber(row[i]), qty = toNumber(row[i+1]);
        if (costo === 0 && qty === 0) return null;
        return { costo, cantidad:qty, m2:toNumber(row[i+2]), costoM2:toNumber(row[i+3]) };
    }

    const out = [];
    for (let i = headerIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || !row[0] || row[0].trim() === "") continue;

        const nombre     = getV(row,["Proyecto","PROYECTO"]) || `Proyecto ${i}`;
        const dirFull    = getV(row,["Dirección","Direccion","Dirección del Proyecto","Mapa","MAPa"]);
        let dirShort     = dirFull;
        if (dirShort.includes(',')) { const pts = dirShort.split(',').map(p=>p.trim()); dirShort = pts.length >= 3 ? `${pts[1]}, ${pts[2]}` : pts[1]||pts[0]; }

        const deptoBlocks = [1,2,3].map(d => { const b = getDeptoBlock(row,`COSTO DEPTO #${d}`); return b ? {label:`Tipo ${d}`,...b} : null; }).filter(Boolean);
        const localBlocks = [1,2].map(l => { const b = getLocalBlock(row,`COSTO LOCAL #${l}`); return b ? {label:`Local ${l}`,...b} : null; }).filter(Boolean);

        const tdep = getN(row,["TOTAL DEPTOS","Total Deptos"]) || deptoBlocks.reduce((a,b)=>a+b.cantidad,0);
        const tloc = getN(row,["TOTAL LOCALES","Total Locales"]) || localBlocks.reduce((a,b)=>a+b.cantidad,0);
        const unidadesTexto = tdep>0&&tloc>0 ? `${tdep} depto${tdep!==1?'s':''} + ${tloc} local${tloc!==1?'es':''}` : tdep>0 ? `${tdep} depto${tdep!==1?'s':''}` : tloc>0 ? `${tloc} local${tloc!==1?'es':''}` : "—";

        const precioVenta = getN(row,["PRECIO DE VENTA PROYECTADO","Precio de Venta Proyectado"]);
        const ganancia    = getN(row,["GANANCIA NETA"]);
        const gastosTot   = getN(row,["GASTOS TOTALES"]);
        const capital     = getN(row,["INVERSIÓN INICIAL"]);
        const roi         = getN(row,["ROI ASOCIACIÓN EN PART 12 meses","ROI ASOCIACIÓN EN PART"]);
        const roiDist     = getN(row,["ROI ADQ DISTRESSED"]);
        const margen      = getN(row,["MARGEN UTILIDAD PROYECTO","MARGEN UTILIDAD"]);

        const imageCell   = getV(row,["Link Imagen Frente","LINK IMAGEN FRENTE"]);
        const allImages   = extractImageUrls(imageCell);

        const alrRaw = getV(row,["Alrededores"]);
        let alrededor = alrRaw ? alrRaw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean) : [];
        if (!alrededor.length && alrRaw) alrededor = alrRaw.split(',').map(s=>s.trim()).filter(Boolean);

        const docs = {
            cv:getV(row,["LINK CV (HORIZONTAL)"]), manual:getV(row,["LINK MANUAL DE PRODUCTO:"]),
            estudioMercado:getV(row,["LINK ESTUDIO DE MERCADO:"]), expediente:getV(row,["LINK EXPEDIENTE;"]),
            gantt:getV(row,["LINK GANTT:"]), googleMaps:getV(row,["LINK GOOGLE MAPS:"])
        };

        const gD = k => getN(row,[k]);
        const gastosDetalle = {
            gastosArquitectura: gD("TOTAL Gastos Operativos Arquitectura") || gD("TOTAL GASTOS OPERATIVOS ARQUITECTURA"),
            aguaLuz: gD("Agua/Luz/Predial") || gD("Agua/Luz"),
            hipoteca: gD("Hipoteca"), gastosLegales: gD("Gastos Legales"),
            mkt: gD("MKT"), comisionesRenova: gD("Comisiones RENOVA"),
            comisionesVenta: gD("Comisiones Venta"), comisionesFin: gD("Comisiones FIN O FONDEO"),
            regimenCond: gD("Régimen Condominio"), licencias: gD("Licencias"),
            imprevistos: gD("Imprevistos"), pagoSinAnticipo: gD("Pago sin anticipo (Utilidad Cliente)")
        };

        const renovaBreakdown = {
            costoXDepto:  gD("COSTO RENOVA X DEPTO"),
            numDeptos:    gD("# Deptos a RENOVA"),
            totalRef:     gD("TOTAL RENOVA DEPTOS\n(Solo referencia)") || gD("TOTAL RENOVA DEPTOS"),
            pctCalculadora: gD("% CALCULADORA RENOVA"),
            totalAjustado:  gD("TOTAL RENOVA AJUSTADO")
        };

        const timeline = FASES_CONFIG.map(f => {
            const ini = getV(row,f.inicioKey), fin = getV(row,f.finKey);
            return { fase:f.fase, inicio:ini, fin, color:f.color, inicioDate:parseDate(ini), finDate:parseDate(fin) };
        }).filter(t => t.inicio || t.fin);

        out.push({
            id: nombre.toLowerCase().replace(/[^a-z0-9]+/g,'-'),
            num: (out.length+1).toString().padStart(2,'0'),
            nombre, direccion:dirFull, direccionResumida:dirShort,
            construccion: getN(row,["Construcción m2"]), terreno: getN(row,["Terreno m2"]),
            niveles: getN(row,["Niveles"]), antiguedad: getN(row,["Antiguedad"]),
            supVendible: getN(row,["Sup. Vendible"]),
            frentes: getV(row,["Frentes"]),
            cuentaCatastral: getV(row,["Cuenta Catastral"]),
            tipoVivienda: getV(row,["Tipo de Vivienda"]) || "—",
            usoDeSuelo: getV(row,["Uso de suelo"]) || "—",
            descripcion: getV(row,["Descripción del Proyecto"]),
            alrededores: alrededor,
            precioVenta, ganancia, gastosTotales:gastosTot, capitalAltaltium:capital,
            rendimiento: roi || roiDist, roiDistressed: roiDist,
            margen: margen || (precioVenta ? (ganancia/precioVenta)*100 : 0),
            unidadesTexto, totalUnidades: tdep+tloc, totalDeptos:tdep, totalLocales:tloc,
            coverImage: allImages[0]||"", allImages,
            timeline, docs, deptoBlocks, localBlocks,
            totalCostoDeptos: getN(row,["TOTALCOSTO  DEPTOS","TOTAL COSTO DEPTOS","TOTALCOSTO DEPTOS"]),
            totalCostoLocales: getN(row,["TOTAL COSTO LOCALES","TOTALCOSTO LOCALES"]),
            costoEdificio: getN(row,["COSTO EDIFICIO"]),
            gastosOperativos: getN(row,["GASTOS OPERATIVOS (Con Comisiones)","GASTOS OPERATIVOS"]),
            totalRenova: getN(row,["TOTAL RENOVA"]),
            costoXUnidad: getN(row,["COSTO X UNIDAD"]),
            precioM2Post: getN(row,["PRECIO / M2 PROMEDIO","PRECIO / M2 PROMEDIO\n(Post Renovación)"]),
            gananciaXUnidad: getN(row,["GANANCIA / UNIDAD"]),
            inversionOpc2: getN(row,["INVERSIÓN INICIAL OPC #2","INVERSIÓN INICIAL OPC#2"]),
            roiOpc2: getN(row,["ROI ASOCIACIÓN EN PART OPC #2 12 meses","ROI ASOCIACIÓN AJUSTADO SEGUN PLAZO","ROI ASOCIACIÓN EN PART OPC"]),
            clubParte1Inv: getN(row,["Club de Socios Parte 1"]),
            clubAporte1:   getN(row,["Aporte 1"]),
            clubParte2Inv: getN(row,["Club de Socios Parte 2"]),
            clubAporte2:   getN(row,["Aporte 2"]),
            totalInversionClub: getN(row,["TOTAL INVERSION","TOTAL INVERSIÓN"]),
            sinInviertes: getN(row,["SIN INVIERTES"]),
            tuGanancia: getN(row,["TU GANANCIA"]),
            totalConGanancia: getN(row,["TOTAL CON GANANCIA"]),
            roiAnual: getN(row,["ROI ANUAL"]),
            plazoMeses: getN(row,["Plazo Meses"]),
            margenGV: margen || (precioVenta ? (ganancia/precioVenta)*100 : 0),
            gastosDetalle, renovaBreakdown
        });
    }
    return out;
}

function computeMetrics(ps) {
    const tv = ps.reduce((a,p)=>a+p.precioVenta,0);
    const tg = ps.reduce((a,p)=>a+p.ganancia,0);
    const tc = ps.reduce((a,p)=>a+p.capitalAltaltium,0);
    const tgast = ps.reduce((a,p)=>a+p.gastosTotales,0);
    return { totalVenta:tv, totalGanancia:tg, totalCapital:tc, totalGastos:tgast,
             roiPortafolio: tc ? (tg/tc)*100 : 0,
             totalUnidades: ps.reduce((a,p)=>a+p.totalUnidades,0) };
}

const mxn = (n,dec=2) => {
    if (!n || n === 0) return '—';
    if (n >= 1e6) return `$${(n/1e6).toFixed(dec)}M`;
    if (n >= 1e3) return `$${(n/1e3).toFixed(0)}K`;
    return `$${Math.round(n).toLocaleString('es-MX')}`;
};
const pct = n => (n && !isNaN(n)) ? `${n.toFixed(1)}%` : '—';
const fmt = n => (!n || n === 0) ? '—' : Math.round(n).toLocaleString('es-MX');

/* ── CAROUSEL ───────────────────────────────────────────── */
function setupCarousel(cid, total) {
    const prev = document.getElementById(`prev-${cid}`);
    const next = document.getElementById(`next-${cid}`);
    const dots = document.querySelectorAll(`[data-dot="${cid}"]`);
    const update = (idx) => {
        const img = document.getElementById(`carousel-img-${cid}`);
        const imgs = window[`carouselImages_${cid}`];
        if (img && imgs && imgs[idx]) img.src = imgs[idx];
        dots.forEach(d => d.classList.toggle('active', +d.getAttribute('data-index') === idx));
    };
    if (prev) prev.onclick = () => { const i = ((window[`carouselIndex_${cid}`]||0)-1+total)%total; window[`carouselIndex_${cid}`]=i; update(i); };
    if (next) next.onclick = () => { const i = ((window[`carouselIndex_${cid}`]||0)+1)%total; window[`carouselIndex_${cid}`]=i; update(i); };
    dots.forEach(d => d.onclick = () => { const idx=+d.getAttribute('data-index'); window[`carouselIndex_${cid}`]=idx; update(idx); });
}

/* ── UNITS PIVOT ────────────────────────────────────────── */
function renderUnitsPivotCard(p) {
    const hasD = p.deptoBlocks?.length > 0;
    const hasL = p.localBlocks?.length > 0;
    if (!hasD && !hasL) return '';

    const tdep = p.totalDeptos || (hasD ? p.deptoBlocks.reduce((a,b)=>a+b.cantidad,0) : 0);
    const tloc = p.totalLocales || (hasL ? p.localBlocks.reduce((a,b)=>a+b.cantidad,0) : 0);
    const cDep = p.totalCostoDeptos || (hasD ? p.deptoBlocks.reduce((a,b)=>a+b.costo,0) : 0);
    const cLoc = p.totalCostoLocales || (hasL ? p.localBlocks.reduce((a,b)=>a+b.costo,0) : 0);
    const cAll = (cDep||0) + (cLoc||0);

    let pills = '';
    if (tdep>0) pills += `<div class="units-pivot-pill"><span class="pill-count">${tdep}</span> Deptos</div>`;
    if (tloc>0) pills += `<div class="units-pivot-pill" style="border-color:rgba(192,125,32,0.4);color:var(--amber);"><span class="pill-count">${tloc}</span> Locales</div>`;

    let dRows = '';
    if (hasD) {
        dRows += `<tr><td colspan="5" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dark);padding:14px 24px 8px;background:#fafafc;border-bottom:1px solid var(--gray2);">🏢 Departamentos</td></tr>`;
        dRows += `<tr><th>Tipo</th><th>Cantidad</th><th>m² / Unidad</th><th>Costo Unitario</th><th>Costo Total</th></tr>`;
        for (const d of p.deptoBlocks) {
            const ct = d.costo>0 ? d.costo*d.cantidad : 0;
            dRows += `<tr><td><span class="unit-type-badge">DEPTO ${d.label.split(' ')[1]}</span></td><td>${d.cantidad||0}</td><td>${d.m2>0?d.m2+' m²':'—'}</td><td class="cost-cell">${d.costo>0?mxn(d.costo):'—'}</td><td class="cost-cell">${ct>0?mxn(ct):mxn(d.costo)}</td></tr>`;
        }
        if (tdep>0||cDep>0) dRows += `<tr class="subtotal-row"><td><strong>Total Departamentos</strong></td><td><strong>${tdep}</strong></td><td></td><td></td><td class="cost-cell"><strong>${mxn(cDep)}</strong></td></tr>`;
    }
    let lRows = '';
    if (hasL) {
        lRows += `<tr><td colspan="5" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dark);padding:14px 24px 8px;background:#fafafc;border-bottom:1px solid var(--gray2);">🏪 Locales Comerciales</td></tr>`;
        lRows += `<tr><th>Tipo</th><th>Cantidad</th><th>m² / Unidad</th><th>Costo Unitario</th><th>Costo Total</th></tr>`;
        for (const l of p.localBlocks) {
            const ct = l.costo>0 ? l.costo*l.cantidad : 0;
            lRows += `<tr><td><span class="unit-type-badge local">LOCAL ${l.label.split(' ')[1]}</span></td><td>${l.cantidad||0}</td><td>${l.m2>0?l.m2+' m²':'—'}</td><td class="cost-cell">${l.costo>0?mxn(l.costo):'—'}</td><td class="cost-cell">${ct>0?mxn(ct):mxn(l.costo)}</td></tr>`;
        }
        if (tloc>0||cLoc>0) lRows += `<tr class="subtotal-row"><td><strong>Total Locales</strong></td><td><strong>${tloc}</strong></td><td></td><td></td><td class="cost-cell"><strong>${mxn(cLoc)}</strong></td></tr>`;
    }
    const totalRow = (cAll>0||tdep+tloc>0) ? `<tr class="total-row"><td><strong>TOTAL UNIDADES</strong></td><td><strong>${tdep+tloc}</strong></td><td></td><td></td><td class="cost-cell total">${mxn(cAll)}</td></tr>` : '';
    return `<div class="units-pivot-card">
      <div class="units-pivot-header">
        <div class="units-pivot-header-title">🏘️ Desglose de Unidades</div>
        <div class="units-pivot-header-right">
          ${pills}
          ${cAll>0?`<div class="units-pivot-cost-total"><div class="units-pivot-cost-total-label">Costo Total</div><div class="units-pivot-cost-total-val">${mxn(cAll)}</div></div>`:''}
        </div>
      </div>
      <div style="overflow-x:auto;"><table class="units-pivot-table">${dRows}${lRows}${totalRow}</table></div>
    </div>`;
}

/* ── BREAKDOWN CARD ─────────────────────────────────────── */
function renderBreakdownCard(p) {
    const mainSegs = [];
    if (p.costoEdificio > 0) mainSegs.push({ label:'Costo del edificio', value:p.costoEdificio, color:'#52BEC0' });

    const renova = p.renovaBreakdown || {};
    const totalRenovaSeg = renova.totalAjustado || p.totalRenova;
    if (totalRenovaSeg > 0) mainSegs.push({ label:'Costos RENOVA', value:totalRenovaSeg, color:'#3A9EAD',
        subItems:[
            { label:'COSTO RENOVA X DEPTO', amount:renova.costoXDepto },
            { label:'# Deptos a RENOVA', amount:renova.numDeptos, isNumber:true },
            { label:'TOTAL RENOVA DEPTOS (Ref.)', amount:renova.totalRef },
            { label:'% CALCULADORA RENOVA', amount:renova.pctCalculadora, isPercent:true }
        ]
    });

    const SUB_GASTOS = [
        {label:'Gastos Operativos Arquitectura',key:'gastosArquitectura',color:'#1F6D6E'},
        {label:'Agua/Luz/Predial',key:'aguaLuz',color:'#278A8C'},
        {label:'Hipoteca',key:'hipoteca',color:'#2FA8AA'},
        {label:'Gastos Legales',key:'gastosLegales',color:'#52BEC0'},
        {label:'MKT',key:'mkt',color:'#7ECFD0'},
        {label:'Comisiones RENOVA',key:'comisionesRenova',color:'#A8E6E7'},
        {label:'Comisiones Venta',key:'comisionesVenta',color:'#E67E22'},
        {label:'Comisiones FIN O FONDEO',key:'comisionesFin',color:'#F39C12'},
        {label:'Régimen Condominio',key:'regimenCond',color:'#F1C40F'},
        {label:'Licencias',key:'licencias',color:'#9B59B6'},
        {label:'Imprevistos',key:'imprevistos',color:'#E74C3C'},
        {label:'Pago sin anticipo',key:'pagoSinAnticipo',color:'#C0392B'}
    ];

    let gastosOpTotal = SUB_GASTOS.reduce((a,g)=>a+(p.gastosDetalle[g.key]>0?p.gastosDetalle[g.key]:0),0);
    if (gastosOpTotal > 0) mainSegs.push({ label:'Gastos operativos (con comisiones)', value:gastosOpTotal, color:'#E67E22' });
    if (mainSegs.length === 0 && p.gastosTotales > 0) mainSegs.push({ label:'Gastos totales', value:p.gastosTotales, color:'#3B3B3B' });

    const maxVal = Math.max(...mainSegs.map(s=>s.value),1);
    const cid    = 'bd-' + p.id.replace(/-/g,'');

    let filasHtml = '';
    for (const seg of mainSegs) {
        const bp = Math.round((seg.value/maxVal)*100);
        filasHtml += `<div class="bd-wf-row"><div class="bd-wf-left"><span class="bd-wf-dot" style="background:${seg.color};"></span><span class="bd-wf-label">${seg.label}</span></div><div class="bd-wf-bar-wrap"><div class="bd-wf-bar" style="width:${bp}%;background:${seg.color};"></div></div><div class="bd-wf-amount">${mxn(seg.value)}</div></div>`;
        if (seg.subItems) {
            for (const sub of seg.subItems) {
                const sv = sub.amount||0;
                const disp = sub.isPercent ? `${sv.toFixed(1)}%` : sub.isNumber ? Math.round(sv).toLocaleString('es-MX') : sv>0?mxn(sv):'—';
                const sbp = (sv>0&&maxVal>0)?Math.round((sv/maxVal)*100):0;
                filasHtml += `<div class="bd-sub-row"><div class="bd-sub-left"><span class="bd-sub-dot" style="background:#3A9EAD;"></span><span class="bd-sub-label">${sub.label}</span></div><div class="bd-sub-bar-wrap"><div class="bd-sub-bar" style="width:${sbp}%;background:#3A9EAD;opacity:0.55;"></div></div><div class="bd-sub-amount">${disp}</div></div>`;
            }
        }
        if (seg.label === 'Gastos operativos (con comisiones)' && gastosOpTotal > 0) {
            for (const sub of SUB_GASTOS) {
                const sv = p.gastosDetalle[sub.key];
                if (sv > 0) {
                    const sbp = Math.round((sv/maxVal)*100);
                    filasHtml += `<div class="bd-sub-row"><div class="bd-sub-left"><span class="bd-sub-dot" style="background:${sub.color};"></span><span class="bd-sub-label">${sub.label}</span></div><div class="bd-sub-bar-wrap"><div class="bd-sub-bar" style="width:${sbp}%;background:${sub.color};"></div></div><div class="bd-sub-amount">${mxn(sv)}</div></div>`;
                }
            }
        }
    }

    const margenFinal = p.margenGV || p.margen || 0;
    const donutData   = [...mainSegs.map(s=>s.value), p.ganancia>0?p.ganancia:0];
    const donutColors = [...mainSegs.map(s=>s.color), '#2E9E6B'];
    const donutLabels = [...mainSegs.map(s=>s.label), 'Ganancia neta'];

    const legendHtml = `
      <div class="bd-legend-item" style="background:#f5f7f9;border-radius:var(--radius-sm);padding:6px 10px;margin-bottom:6px;">
        <div class="bd-legend-left"><span class="bd-legend-dot" style="background:var(--black);"></span><strong>Precio de Venta Proyectado</strong></div>
        <span class="bd-legend-pct">100% (${mxn(p.precioVenta)})</span>
      </div>
      ${mainSegs.map(s=>`<div class="bd-legend-item"><div class="bd-legend-left"><span class="bd-legend-dot" style="background:${s.color};"></span>${s.label}</div><span class="bd-legend-pct">−${((s.value/(p.precioVenta||1))*100).toFixed(1)}% (−${mxn(s.value)})</span></div>`).join('')}
      ${p.ganancia>0?`<div class="bd-legend-item" style="border-top:1px solid var(--gray2);padding-top:8px;margin-top:4px;"><div class="bd-legend-left"><span class="bd-legend-dot" style="background:#2E9E6B;"></span><strong style="color:#2E9E6B;">Ganancia neta</strong></div><span class="bd-legend-pct" style="color:#2E9E6B;font-size:var(--fs-h4);">${pct(margenFinal)} (+${mxn(p.ganancia)})</span></div>`:''}`;

    return `<div class="breakdown-card">
      <div class="bd-card-header">
        <div class="bd-card-header-title">💰 Desglose de inversión &amp; ganancia</div>
        <div class="bd-card-header-right">
          <div class="bd-card-header-label">Precio de venta proyectado</div>
          <div class="bd-card-header-val">${mxn(p.precioVenta)}</div>
        </div>
      </div>
      <div class="bd-body">
        <div class="bd-waterfall-scroll"><div class="bd-waterfall">${filasHtml}</div></div>
        <div class="bd-subtotal-row"><div class="bd-subtotal-label">Total gastos</div><div></div><div class="bd-subtotal-amount">${mxn(p.gastosTotales||mainSegs.reduce((a,s)=>a+s.value,0))}</div></div>
        <div class="bd-main-content">
          <div class="bd-legend">${legendHtml}</div>
          <div class="bd-donut-wrap"><canvas id="${cid}-donut"></canvas></div>
        </div>
      </div>
    </div>
    <script>
    (function(){
      var canvas = document.getElementById('${cid}-donut');
      if (!canvas || !window.Chart) return;
      new Chart(canvas.getContext('2d'),{
        type:'doughnut',
        data:{ labels:${JSON.stringify(donutLabels)}, datasets:[{ data:${JSON.stringify(donutData)}, backgroundColor:${JSON.stringify(donutColors)}, borderWidth:2, borderColor:'#0A0A0A' }] },
        options:{ responsive:true, maintainAspectRatio:false, cutout:'66%', plugins:{ legend:{ display:false } } }
      });
    })();
    <\/script>`;
}

          <div class="club-card-divider"></div>
          <div class="club-row"><span class="club-row-label">Aporte por socio</span><span class="club-row-val">${mxn(p.clubAporte2,0)}</span></div>
          ${p.tuGanancia>0?`<div class="club-row"><span class="club-row-label">Ganancia estimada</span><span class="club-row-val gain">+${mxn(p.tuGanancia*0.5,0)}</span></div>`:''}
          ${p.totalConGanancia>0?`<div class="club-row"><span class="club-row-label">Total con Ganancia</span><span class="club-row-val gold">${mxn(p.totalConGanancia*0.5+p.clubAporte2,0)}</span></div>`:''}
          ${p.roiAnual>0?`<div class="club-row" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--gray2)"><span class="club-row-label">ROI Anual</span><span class="club-row-val" style="color:var(--teal);font-family:'Barlow Condensed',sans-serif;font-size:var(--fs-h3);font-weight:700;">${pct(p.roiAnual)}</span></div>`:''}
        </div>`:'<div class="club-card" style="display:flex;align-items:center;justify-content:center;color:#aaa;font-size:var(--fs-base);">No disponible</div>'}
      </div>
    </div>` : '';

    const finSectionHtml = clubHtml
        ? `<div class="fin-section"><div class="fin-dual-row"><div class="fin-dual-col">${invCardHtml}</div><div class="fin-dual-col">${clubHtml}</div></div></div>`
        : `<div class="fin-section">${invCardHtml}</div>`;

    /* Timeline */
    let timelineHtml = '';
    if (p.timeline.length) {
        const valid = p.timeline.filter(t => t.inicioDate && t.finDate);
        let minF=null, maxF=null;
        if (valid.length) { minF=new Date(Math.min(...valid.map(t=>t.inicioDate))); maxF=new Date(Math.max(...valid.map(t=>t.finDate))); }
        const range = (minF&&maxF) ? maxF-minF : 0;
        const MESES_N = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        let headerMeses = '';
        if (minF&&maxF&&range>0) {
            let cur = new Date(minF.getFullYear(),minF.getMonth(),1);
            const end = new Date(maxF.getFullYear(),maxF.getMonth(),1);
            const labels = [];
            while (cur<=end) { const off=((cur-minF)/range)*100; labels.push(`<span style="position:absolute;left:${off.toFixed(1)}%;font-size:var(--fs-xs);color:#888;white-space:nowrap;transform:translateX(-20%);">${MESES_N[cur.getMonth()]} ${cur.getFullYear()}</span>`); cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); }
            headerMeses = `<div style="position:relative;height:20px;margin-bottom:8px;margin-left:142px;margin-right:132px;border-bottom:1px dashed var(--gray3);">${labels.join('')}</div>`;
        }
        const filas = p.timeline.map(t => {
            let lp=0, wp=85;
            if (t.inicioDate&&t.finDate&&range>0) { lp=((t.inicioDate-minF)/range)*100; wp=((t.finDate-t.inicioDate)/range)*100; if(wp<1)wp=1; }
            return `<div class="tl-row"><div class="tl-label">${t.fase}</div><div class="tl-track"><div class="tl-bar" style="left:${lp.toFixed(1)}%;width:${wp.toFixed(1)}%;background:${t.color};"></div></div><div class="tl-weeks">${t.inicio&&t.fin?t.inicio+' – '+t.fin:(t.inicio||t.fin||'')}</div></div>`;
        }).join('');
        timelineHtml = `<div class="timeline-wrap"><div style="font-family:'Barlow Condensed',sans-serif;font-size:var(--fs-sm);font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#666;margin-bottom:14px;">📅 CRONOGRAMA DEL PROYECTO</div>${headerMeses}${filas}</div>`;
    }

    con.innerHTML = `
    <div class="detail-wrap">
      <div class="hero-split">
        <div class="left-col">
          <div class="image-card">${carouselHtml}${techOverlay}</div>
          ${docsDescHtml}
        </div>
        <div class="map-card">
          <div class="map-header">UBICACIÓN ESTRATÉGICA</div>
          ${mapHtml}
          ${surroundHtml}
          ${upsideHtml}
        </div>
      </div>
      ${renderUnitsPivotCard(p)}
      ${finSectionHtml}
      ${renderBreakdownCard(p)}
      ${timelineHtml}
      <button onclick="showPortfolioTab()" style="display:inline-flex;align-items:center;gap:8px;padding:11px 28px;background:var(--teal);color:white;border:none;border-radius:40px;font-family:'Barlow Condensed',sans-serif;font-size:var(--fs-base);font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:opacity var(--transition);margin-top:16px;" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">← Volver al Portafolio</button>
    </div>`;

    if (p.allImages?.length > 1) setupCarousel(cid, p.allImages.length);

    /* Map error handling */
    setTimeout(() => {
        const iframe = con.querySelector('.map-frame');
        const placeholder = document.getElementById(`map-placeholder-${cid}`);
        if (iframe && placeholder) {
            iframe.addEventListener('error', () => { iframe.style.display='none'; placeholder.style.display='flex'; });
        }
    }, 150);
}

/* ── INIT ───────────────────────────────────────────────── */
async function init() {
    const fechaEl = document.getElementById('header-fecha');
    try {
        const res = await fetch(CSV_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const rows = parseCSV(text);
        projects = buildProjectsFromRows(rows);
        if (projects.length === 0) throw new Error("No se encontraron proyectos en el CSV");
        portfolioMetrics = computeMetrics(projects);
        buildTabs();
        renderPortfolioView();
        setActiveTab('portfolio');
        fechaEl.innerHTML = new Date().toLocaleDateString('es-MX',{year:'numeric',month:'long',day:'numeric'}) + '<br><span style="font-size:var(--fs-xs);">Actualizado</span>';
        window.addEventListener('resize', () => { chartComparativo?.resize(); chartROI?.resize(); });
    } catch(e) {
        console.error(e);
        fechaEl.innerHTML = '<strong style="color:#ff6b6b">Error al cargar</strong>';
        const c = document.getElementById('tab-portafolio');
        if (c) c.innerHTML = `<div class="error-message">⚠️ Error al cargar datos: ${e.message}<br><br>Revisa la consola para más detalles.</div>`;
    }
}

window.showPortfolioTab = showPortfolioTab;
window.showProjectDetail = showProjectDetail;
init();
</script>
</body>
</html>
